<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#173242" stroke-width="0.55" opacity="0.32"/>
    </pattern>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="quote-line-1">
      <rect x="58" y="92" width="0" height="44">
        <animate attributeName="width" from="0" to="360" begin="0.35s" dur="1.1s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="quote-line-2">
      <rect x="58" y="132" width="0" height="44">
        <animate attributeName="width" from="0" to="420" begin="1.35s" dur="1.25s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="618" height="298" rx="16" fill="#05090f" stroke="#1c3444" stroke-width="2"/>
  <rect x="12" y="12" width="596" height="276" rx="11" fill="url(#grid)"/>

  <circle cx="27" cy="27" r="4" fill="#ff6b6b" opacity="0.78"/>
  <circle cx="41" cy="27" r="4" fill="#f6c85f" opacity="0.78"/>
  <circle cx="55" cy="27" r="4" fill="#7ee787" opacity="0.78"/>
  <text x="310" y="31" text-anchor="middle" fill="#6f8190" font-size="10"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.4">retr0seven://manifest</text>
  <line x1="18" y1="40" x2="602" y2="40" stroke="#193242"/>

  <text x="34" y="70" fill="#7ee787" font-size="12.5"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">mouad@retr0seven:~$ cat principle.txt</text>

  <text x="34" y="135" fill="#173f48" opacity="0.7" font-size="72" font-weight="700"
        font-family="Georgia,serif">“</text>

  <g fill="url(#accent)" filter="url(#glow)"
     font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
     font-size="27" font-weight="700" letter-spacing="-0.7">
    <text x="58" y="126" clip-path="url(#quote-line-1)">you are less valuable</text>
    <text x="58" y="166" clip-path="url(#quote-line-2)">than the data you produce</text>
  </g>

  <rect x="58" y="136" width="8" height="31" rx="1" fill="#67e8f9" opacity="0">
    <animate attributeName="x" from="58" to="462" begin="1.35s" dur="1.25s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.96;1" begin="1.35s" dur="1.25s" fill="freeze"/>
  </rect>

  <line x1="34" y1="195" x2="586" y2="195" stroke="#193242"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.55s" fill="freeze"/>
    <text x="34" y="225" fill="#f0f6fc" font-size="18" font-weight="700"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Mouad Hassari</text>
    <text x="34" y="249" fill="#9aa9b7" font-size="12.2"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">IT-Specialist | Senior Computer Science Student @AUI</text>
    <text x="34" y="273" fill="#5f7483" font-size="10.5"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">casablanca, morocco  ·  github.com/Retr0Seven</text>
    <rect x="578" y="260" width="8" height="14" fill="#67e8f9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
